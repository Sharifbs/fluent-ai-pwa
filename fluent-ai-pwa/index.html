<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FluentAI - English Speaking Coach</title>
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-recording {
      animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-[100dvh] flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shrink-0 z-10 shadow-sm">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-200">
        <i class="fa-solid fa-microphone-lines text-base"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-900 leading-tight">FluentAI</h1>
        <p class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> Voice Coach Ready
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="installBtn" class="hidden bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
        <i class="fa-solid fa-download"></i> Install
      </button>
      <button onclick="clearChat()" title="Restart Conversation" class="w-9 h-9 rounded-full text-slate-500 hover:bg-slate-100 flex items-center justify-center transition">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>
      <button onclick="toggleModal('settingsModal', true)" title="Voice Settings" class="w-9 h-9 rounded-full text-slate-500 hover:bg-slate-100 flex items-center justify-center transition">
        <i class="fa-solid fa-sliders text-sm"></i>
      </button>
    </div>
  </header>

  <!-- Topic Selector -->
  <div class="bg-white border-b border-slate-100 px-3 py-2.5 shrink-0">
    <div id="topicBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar">
      <button data-topic="Daily Life" class="topic-btn active bg-indigo-600 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full whitespace-nowrap transition shadow-sm">
        ☕ Daily Life
      </button>
      <button data-topic="Job Interview" class="topic-btn bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs font-semibold px-3.5 py-1.5 rounded-full whitespace-nowrap transition">
        💼 Job Interview
      </button>
      <button data-topic="Travel & Airport" class="topic-btn bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs font-semibold px-3.5 py-1.5 rounded-full whitespace-nowrap transition">
        ✈️ Travel
      </button>
      <button data-topic="Casual Small Talk" class="topic-btn bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs font-semibold px-3.5 py-1.5 rounded-full whitespace-nowrap transition">
        💬 Casual Chat
      </button>
      <button data-topic="Office & Meetings" class="topic-btn bg-slate-100 text-slate-600 hover:bg-slate-200 text-xs font-semibold px-3.5 py-1.5 rounded-full whitespace-nowrap transition">
        🏢 Workplace
      </button>
    </div>
  </div>

  <!-- Chat Messages Container -->
  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
    <!-- Messages injected here -->
  </main>

  <!-- Reply Idea Banner -->
  <div id="ideaBox" class="hidden mx-4 mb-2 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 flex items-start justify-between gap-2 shadow-sm">
    <div>
      <span class="font-bold text-amber-700 block mb-0.5"><i class="fa-regular fa-lightbulb mr-1"></i> Try saying this:</span>
      <p id="ideaText" class="font-medium text-slate-800"></p>
    </div>
    <button onclick="useIdea()" class="bg-amber-500 text-white px-2.5 py-1 rounded-lg font-semibold shrink-0 hover:bg-amber-600">
      Speak/Send
    </button>
  </div>

  <!-- Live Speech Transcript Preview -->
  <div id="liveTranscriptBox" class="hidden px-4 py-2 bg-indigo-50 border-t border-indigo-100 text-xs text-indigo-800 flex items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
    <span id="liveTranscriptText" class="italic truncate">Listening...</span>
  </div>

  <!-- Bottom Input & Mic Controls -->
  <footer class="bg-white border-t border-slate-200 px-3 pt-2.5 pb-4 shrink-0">
    <div class="max-w-2xl mx-auto flex items-center gap-2">
      <button onclick="showReplyIdea()" title="Need a reply idea?" class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 hover:bg-amber-200 flex items-center justify-center shrink-0 transition">
        <i class="fa-regular fa-lightbulb"></i>
      </button>

      <div class="flex-1 relative flex items-center">
        <input
          id="textInput"
          type="text"
          placeholder="Type or tap mic to speak..."
          class="w-full bg-slate-100 text-slate-800 text-sm rounded-full pl-4 pr-10 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          onkeydown="if(event.key === 'Enter') handleSendText()"
        />
        <button onclick="handleSendText()" class="absolute right-1.5 w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-700 transition">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>

      <button
        id="micBtn"
        onclick="toggleRecording()"
        class="w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white flex items-center justify-center shadow-lg shadow-indigo-200 shrink-0 transition"
      >
        <i id="micIcon" class="fa-solid fa-microphone text-lg"></i>
      </button>
    </div>
  </footer>

  <!-- Voice Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="font-bold text-slate-800">Voice & Coach Settings</h2>
        <button onclick="toggleModal('settingsModal', false)" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">AI Voice Accent</label>
        <select id="voiceSelect" class="w-full bg-slate-100 text-sm rounded-xl p-2.5 border border-slate-200 focus:outline-none"></select>
      </div>

      <div>
        <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
          <span>Speaking Speed</span>
          <span id="rateValue">1.0x</span>
        </div>
        <input id="rateRange" type="range" min="0.6" max="1.3" step="0.1" value="1.0" class="w-full accent-indigo-600" oninput="document.getElementById('rateValue').textContent = this.value + 'x'" />
      </div>

      <div class="flex items-center justify-between pt-1">
        <span class="text-xs font-semibold text-slate-700">Auto-Speak AI Replies</span>
        <input id="autoSpeakToggle" type="checkbox" checked class="w-4 h-4 accent-indigo-600 rounded" />
      </div>

      <button onclick="toggleModal('settingsModal', false)" class="w-full bg-indigo-600 text-white font-semibold text-sm py-2.5 rounded-xl hover:bg-indigo-700 transition">
        Done
      </button>
    </div>
  </div>

  <script>
    // State Management
    let currentTopic = 'Daily Life';
    let conversationHistory = [];
    let isRecording = false;
    let recognition = null;
    let latestSuggestion = "Hi! I'm doing great today. How about you?";
    let deferredPrompt = null;
    let availableVoices = [];

    const topicStarters = {
      'Daily Life': "Hey there! How is your day going so far? Did you do anything interesting today?",
      'Job Interview': "Welcome! Thank you for coming in today. To get started, could you tell me a little bit about yourself?",
      'Travel & Airport': "Good morning! May I see your passport and boarding pass, please? Where are you flying to today?",
      'Casual Small Talk': "Hey! Long time no see. What have you been up to lately?",
      'Office & Meetings': "Hi everyone, thanks for joining the meeting. Let's start with a quick update on your current tasks."
    };

    const topicSuggestions = {
      'Daily Life': "My day is going pretty well! I just finished some work and now I'm practicing English.",
      'Job Interview': "Thank you! I am a hardworking person who loves learning new skills and solving problems.",
      'Travel & Airport': "Good morning! Here is my passport. I am flying to London for a vacation.",
      'Casual Small Talk': "Not much, just staying busy with work and trying to improve my English speaking!",
      'Office & Meetings': "Sure! I completed the main report yesterday, and today I am working on the presentation."
    };

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      initVoices();
      initSpeechRecognition();
      setupTopics();
      startNewConversation();
      registerPWA();
    });

    // PWA Installation & Service Worker
    function registerPWA() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBtn').classList.remove('hidden');
      });

      document.getElementById('installBtn').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('installBtn').classList.add('hidden');
        }
        deferredPrompt = null;
      });
    }

    // Text-to-Speech Setup
    function initVoices() {
      const load = () => {
        availableVoices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
        const select = document.getElementById('voiceSelect');
        select.innerHTML = '';
        availableVoices.forEach((voice, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `${voice.name} (${voice.lang})`;
          if (voice.lang === 'en-US' && voice.name.includes('Google')) opt.selected = true;
          select.appendChild(opt);
        });
      };
      load();
      speechSynthesis.onvoiceschanged = load;
    }

    function speakText(text, customRate = null) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voiceIdx = document.getElementById('voiceSelect').value;
      if (availableVoices[voiceIdx]) {
        utterance.voice = availableVoices[voiceIdx];
      }
      utterance.rate = customRate || parseFloat(document.getElementById('rateRange').value) || 1.0;
      speechSynthesis.speak(utterance);
    }

    // Speech-to-Text Setup
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Your browser does not support voice recognition. Please use Google Chrome or Safari.");
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.continuous = false;

      let finalTranscript = '';

      recognition.onstart = () => {
        isRecording = true;
        finalTranscript = '';
        speechSynthesis.cancel();
        document.getElementById('micBtn').classList.add('bg-red-500', 'hover:bg-red-600', 'mic-recording');
        document.getElementById('micBtn').classList.remove('bg-indigo-600');
        document.getElementById('micIcon').className = 'fa-solid fa-stop text-lg';
        document.getElementById('liveTranscriptBox').classList.remove('hidden');
        document.getElementById('liveTranscriptText').textContent = 'Listening... Speak in English';
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        document.getElementById('liveTranscriptText').textContent = finalTranscript || interim || 'Listening...';
      };

      recognition.onerror = (event) => {
        stopRecordingUI();
        if (event.error === 'not-allowed') {
          alert("Microphone access denied. Please allow microphone permission in your browser settings.");
        }
      };

      recognition.onend = () => {
        stopRecordingUI();
        const spoken = finalTranscript.trim();
        if (spoken) {
          processUserMessage(spoken);
        }
      };
    }

    function toggleRecording() {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    }

    function stopRecordingUI() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('bg-red-500', 'hover:bg-red-600', 'mic-recording');
      document.getElementById('micBtn').classList.add('bg-indigo-600');
      document.getElementById('micIcon').className = 'fa-solid fa-microphone text-lg';
      document.getElementById('liveTranscriptBox').classList.add('hidden');
    }

    // Topic Management
    function setupTopics() {
      document.querySelectorAll('.topic-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.topic-btn').forEach(b => {
            b.classList.remove('active', 'bg-indigo-600', 'text-white', 'shadow-sm');
            b.classList.add('bg-slate-100', 'text-slate-600');
          });
          btn.classList.add('active', 'bg-indigo-600', 'text-white', 'shadow-sm');
          btn.classList.remove('bg-slate-100', 'text-slate-600');
          currentTopic = btn.dataset.topic;
          startNewConversation();
        });
      });
    }

    function clearChat() {
      speechSynthesis.cancel();
      startNewConversation();
    }

    function startNewConversation() {
      conversationHistory = [];
      document.getElementById('ideaBox').classList.add('hidden');
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';

      const starter = topicStarters[currentTopic];
      latestSuggestion = topicSuggestions[currentTopic];

      appendAIMessage(starter, null);
      conversationHistory.push({ role: 'model', parts: [{ text: JSON.stringify({ reply: starter }) }] });
    }

    // Messaging & AI Backend Call
    function handleSendText() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      processUserMessage(text);
    }

    async function processUserMessage(userText) {
      document.getElementById('ideaBox').classList.add('hidden');
      appendUserMessage(userText);
      const loadingId = appendLoadingBubble();

      conversationHistory.push({ role: 'user', parts: [{ text: userText }] });

      const systemInstruction = `You are FluentAI, a friendly, encouraging English speaking coach.
Current Roleplay Topic: "${currentTopic}".
Keep the conversation engaging and natural with short replies (2-3 sentences max) ending with a follow-up question so the user keeps speaking.
Analyze the user's English sentence. If it has grammar mistakes or sounds unnatural, provide a natural, polite correction in "correction" along with a very brief 1-sentence tip in "tip". If the user's English is already natural and correct, set "correction" and "tip" to null.
Also provide a sample natural response the user could say next in "next_suggestion".

Respond ONLY in valid JSON using this exact schema:
{
  "reply": "Your conversational reply here",
  "correction": "Corrected version of user's sentence or null",
  "tip": "Brief grammar/vocabulary tip or null",
  "next_suggestion": "Example reply for the user"
}`;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents: conversationHistory.slice(-10),
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.7
            }
          })
        });

        const data = await res.json();
        removeElement(loadingId);

        if (!res.ok || data.error) {
          appendAIMessage(`⚠️ Error: ${data.error || 'Could not reach AI server. Check your Vercel GEMINI_API_KEY.'}`, null);
          return;
        }

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        const parsed = JSON.parse(rawText);

        const aiReply = parsed.reply || "That's interesting! Tell me more.";
        if (parsed.next_suggestion) latestSuggestion = parsed.next_suggestion;

        conversationHistory.push({ role: 'model', parts: [{ text: rawText }] });
        appendAIMessage(aiReply, parsed.correction ? { correction: parsed.correction, tip: parsed.tip } : null);

        if (document.getElementById('autoSpeakToggle').checked) {
          speakText(aiReply);
        }
      } catch (err) {
        removeElement(loadingId);
        appendAIMessage("⚠️ Network error. Please check your internet connection and try again.", null);
      }
    }

    // UI Rendering Helpers
    function appendUserMessage(text) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = 'flex justify-end';
      div.innerHTML = `
        <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-[82%] shadow-sm text-sm leading-relaxed">
          ${escapeHtml(text)}
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
    }

    function appendAIMessage(replyText, feedback) {
      const container = document.getElementById('chatContainer');
      const wrapper = document.createElement('div');
      wrapper.className = 'flex flex-col items-start space-y-2 max-w-[88%]';

      const safeReply = escapeHtml(replyText);
      const jsSafeReply = replyText.replace(/'/g, "\\'").replace(/"/g, '&quot;');

      let feedbackHtml = '';
      if (feedback && feedback.correction) {
        const jsSafeCorr = feedback.correction.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        feedbackHtml = `
          <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs w-full shadow-2xs">
            <div class="flex items-center justify-between mb-1">
              <span class="font-bold text-emerald-700"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Better Way to Say It:</span>
              <button onclick="speakText('${jsSafeCorr}')" class="text-emerald-700 hover:text-emerald-900 font-semibold flex items-center gap-1 bg-emerald-100 px-2 py-0.5 rounded-md">
                <i class="fa-solid fa-volume-high text-[10px]"></i> Listen
              </button>
            </div>
            <p class="text-slate-800 font-semibold mb-1">"${escapeHtml(feedback.correction)}"</p>
            ${feedback.tip ? `<p class="text-slate-600 text-[11px]">${escapeHtml(feedback.tip)}</p>` : ''}
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-xs text-sm leading-relaxed">
          <p>${safeReply}</p>
          <div class="flex items-center gap-3 mt-2.5 pt-2 border-t border-slate-100 text-xs text-slate-500">
            <button onclick="speakText('${jsSafeReply}')" class="hover:text-indigo-600 font-medium flex items-center gap-1 transition">
              <i class="fa-solid fa-volume-high"></i> Replay
            </button>
            <button onclick="speakText('${jsSafeReply}', 0.7)" class="hover:text-indigo-600 font-medium flex items-center gap-1 transition">
              <i class="fa-solid fa-gauge-simple-low"></i> Slow
            </button>
          </div>
        </div>
        ${feedbackHtml}
      `;

      container.appendChild(wrapper);
      scrollToBottom();
    }

    function appendLoadingBubble() {
      const id = 'loading-' + Date.now();
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.id = id;
      div.className = 'flex items-start';
      div.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 shadow-xs flex items-center gap-1.5">
          <span class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></span>
          <span class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.15s]"></span>
          <span class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce [animation-delay:0.3s]"></span>
        </div>
      `;
      container.appendChild(div);
      scrollToBottom();
      return id;
    }

    function showReplyIdea() {
      document.getElementById('ideaText').textContent = latestSuggestion;
      document.getElementById('ideaBox').classList.remove('hidden');
    }

    function useIdea() {
      document.getElementById('ideaBox').classList.add('hidden');
      processUserMessage(latestSuggestion);
    }

    function toggleModal(id, show) {
      document.getElementById(id).classList.toggle('hidden', !show);
    }

    function removeElement(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
